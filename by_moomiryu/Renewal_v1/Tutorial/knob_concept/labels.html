<!doctype html><html lang="ko"><meta charset="utf-8"><title>노브 중앙 표기 비교</title><style>/* === MEGAFONT 토큰 — 이 파일 하나가 전부다 ==========================

   색·간격·글자 크기·라운드·모션은 여기 있는 변수만 쓴다.
   하드코딩된 hex나 px는 넣지 않는다. 필요한 값이 없으면 여기 먼저
   토큰을 만들고 쓴다.

   예외가 하나 있다: 메시지의 색은 토큰이 아니다. 그건 사용자가 고르는
   내용이라 `src/lib/palettes-v2.ts`가 데이터로 들고 있다. 앱이 사용자에게
   말할 때의 색이 여기 있는 것이고, 사용자가 벽으로 보내는 색은 저기 있다.

   ─── 왜 한 파일인가 ─────────────────────────────────────────────
   2026-09-11까지 토큰이 두 군데 있었다. 이 파일에 76개, app.css에 45개.
   그런데 이 파일의 76개 중 **아홉 개만 살아 있었다** — 나머지 67개는
   아무도 참조하지 않았고, 그중 일부(--c-brand-*)는 죽은 것끼리만 서로를
   불러서 살아 있는 것처럼 보였다. 실제 시스템은 app.css 쪽 45개(참조 364회)
   였고, 이 파일은 참조 16회짜리 화석이었다.

   문제는 이 파일 머리에 "화면별 CSS는 이 토큰만 참조. 하드코드는 안 됨"
   이라고 **규칙이 이미 적혀 있었다**는 것이다. 규칙이 없어서 안 지켜진 게
   아니라, 규칙이 적힌 파일이 죽어서 안 지켜졌다. 새로 온 사람이 여기에
   토큰을 추가하면 아무 일도 일어나지 않았을 것이다.

   그래서 합쳤다. 토큰이 두 곳에 있으면 그중 하나는 반드시 죽는다.
   ================================================================= */

:root{
  /* ─── 색: 무채 ─────────────────────────────────────────────
     Grey 출처: https://tossmini-docs.toss.im/tds-react-native/foundation/colors/
     50·400·800·900은 지금 쓰이는 데가 없지만 사다리에 구멍을 내지 않는다. */
  --ink: #000000;
  --paper: #ffffff;
  --grey-50: #f9fafb;
  --grey-100: #f2f4f6;
  --grey-200: #e5e8eb;
  --grey-300: #d1d6db;
  --grey-400: #b0b8c1;
  --grey-500: #8b95a1;
  --grey-600: #6b7684;
  --grey-700: #4e5968;
  --grey-800: #333d4b;
  --grey-900: #191f28;

  /* 역할 이름. 화면 CSS는 되도록 이쪽을 부른다 — 회색 사다리의 어느
     칸인지보다 무슨 역할인지가 읽기 쉽다. */
  --body-text: var(--grey-700);
  --muted: var(--grey-600);
  --line: var(--grey-200);

  /* ─── 색: 브랜드 ───────────────────────────────────────────
     실물 하드웨어에서 가져온 빨강. 캐릭터 SVG도 같은 값이다. */
  --brand-main: #cf5b4c;
  --brand-sub: #3cced0;
  --brand-soft: rgb(207 91 76 / 8%);
  /* 그 빨강은 흰 글자를 받치기엔 4.00:1 이라 AA(4.5)에 못 미친다.
     실물 색은 그대로 두고, 흰 글자가 올라앉는 채움 버튼에만 이 한 톤을
     쓴다 — 4.64:1. 캐릭터와 버튼은 홈에서 화면 절반쯤 떨어져 있어
     두 빨강이 나란히 놓이지 않는다. */
  --brand-strong: #ca4939;

  /* 02 성격 화면 바닥에서 올라오는 더운 기운. 스케치가 직접 그린 색이다
     (02a·02b, #77261C를 30%로 깔았다). 브랜드 빨강을 어둡게 만든 값이
     아니라 따로 고른 색이라 --brand-main에서 유도하지 않고 그대로 둔다.
     --brand-soft와 같은 꼴로 적는다 — 알파까지가 이 색의 정의다. */
  --brand-scrim: rgb(119 38 28 / 30%);

  /* 소개 첫 장(About)의 밤. 순검정이 아니라 작가가 고른 아주 어두운 자두색
     이다 — 삽화 안의 배경 사각형이 이 값이라, 삽화 아래로 이어 까는 면도
     같아야 한 겹으로 읽힌다. --ink(#000)로 깔았더니 두 검정이 갈렸다. */
  --night: #120306;

  /* ─── 캐릭터가 입는 색 ─────────────────────────────────────
     메가폰트와 구경꾼들이 그려지는 두 색이다. 참여자가 고르는 메시지
     색이 아니므로 palettes-v2.ts 예외에 해당하지 않는다 — 앱이 제
     캐릭터를 칠하는 색이라 여기 있어야 한다.

     2026-09-21까지 CSS와 TS 두 군데에 각각 hex로 박혀 있었다. 이 파일
     머리말이 적어 둔 그 상황이다: **토큰이 두 곳에 있으면 그중 하나는
     반드시 죽는다.**

     --char-cyan은 --brand-sub(#3cced0)과 **다른 파랑**이다. 그쪽은 UI가
     쓰는 청록이고 이쪽은 작가가 캐릭터에 칠한 하늘색이라, 둘을 합치면
     화면에서 두 가지가 같은 것이 된다. */
  --char-cyan: #2ce9f7;
  /* 발밑 그림자. 흰 바닥에 지는 그늘로 작가가 고른 보라 회색이다 */
  --char-shade: #5a5580;
  /* 홈 바닥(--grey-200) 위의 그림자 색. --char-shade를 2할 얹은 **결과**를
     불투명한 한 색으로 미리 섞어 둔 것이다(2026-09-22). 홈에서는 메가폰트의
     그림자와 구경꾼 여섯의 그림자가 서로 다른 층에 살아, 반투명으로 두면
     겹치는 자리만 두 번 깔려 진해진다. 불투명하면 몇 장이 겹쳐도 한 색이다.
     바닥이 --grey-200이 아닌 자리(튜토리얼의 흰 판)에는 쓰지 않는다 —
     거기서는 종이 조각처럼 뜬다. */
  --char-shade-floor: color-mix(in srgb, var(--char-shade) 20%, var(--grey-200));

  /* 미리보기 **위에** 앉는 보조 버튼의 바탕.
     미리보기는 색이 바뀌는 면이라(지금은 빨강, 04에서 참여자가 고른다)
     그 위의 버튼은 어느 색에서도 읽혀야 한다. 검정 계열로 깔고 흰 글자를
     얹으면 밝은 면에서도 어두운 면에서도 글자와 바탕이 함께 갈린다 —
     흰 반투명은 밝은 면 위에서 사라진다. --brand-scrim(30%)은 붉은 기가
     돌고 옅어서 이 일에는 못 쓴다. */
  --face-scrim: rgb(0 0 0 / 34%);
  --face-scrim-on: rgb(0 0 0 / 56%);

  /* 눌린 상태. 브랜드 컨트롤은 brightness로 답하고, 중립 표면은 이 틴트. */
  --ink-press: #333333;
  --press-tint: rgba(0, 0, 0, 0.08);

  /* ─── 활자 ─────────────────────────────────────────────────
     DESIGN.md의 위계. 광학 조정 전이라 관습적인 굵기와 짝지어 둔다. */
  --fs-h1: 36px;
  --fs-h2: 30px;
  --fs-h3: 24px;
  --fs-h4: 22px;
  --fs-body: 16px;
  --fs-body-s: 14px;
  /* 기본 제목 행간. 홈·질문·튜토리얼은 읽기 편한 1.5를 쓴다. */
  --lh-head: 1.3;
  /* 아래 둘은 참조 문서에 없는 자리다 — 우리 확장이라고 적어 둔다.
     라벨·수치·캡션은 이 앱에 반드시 필요하고, 저쪽은 그 역할을
     문서화하지 않았다. */
  --fs-cap: 14px;
  --fs-cap-s: 12px;
  /* 버튼 글자. 사다리(36·30·24·22·16·14·12)에 없던 값이라 채움 버튼 둘이
     각자 17px을 적고 있었다 — 한쪽만 고치면 갈린다. 참조 문서가 버튼을
     17로 못박아 두었으므로(DESIGN.md) 값을 바꾸는 대신 칸을 하나 낸다.
     본문(16)보다 한 눈금 큰 자리다. */
  --fs-btn: 17px;

  /* ─── 간격 ─────────────────────────────────────────────────
     참조 문서가 관측한 군집: 4 · 6 · 8 · 16 · 24 · 32.
     그 문서 스스로 "모든 토큰의 증거는 아니다"라고 하므로 12를 한 칸
     보태 쓴다 — 이건 우리 확장이다. 10·14·18·20·26은 전부 걷어냈다. */
  --s1: 4px;
  --s2: 6px;
  --s3: 8px;
  --s4: 12px;   /* 로컬 확장 */
  --s5: 16px;
  --s6: 24px;
  --s7: 32px;

  /* 화면 좌우 여백. 문서의 군집(4·6·8·16·24·32)에는 20이 아예 없는데,
     제품 화면 51장 중 36장이 20이었다. 제품을 따른다. */
  --pad-x: 20px;

  /* ─── 버튼 사다리 ──────────────────────────────────────────
     문서는 높이와 라운드를 한 짝으로 묶는다:
       small 32/8 · medium 38/10 · large 48/14 · xlarge 56/16
     높이는 실측과 정확히 맞았다 — 기본 버튼 56px, 34장 중 34장.
     라운드는 안 맞았다. 제품은 34장 중 30장이 14다. 즉 높이는 xlarge를,
     라운드는 large의 값을 쓴다. 짝을 깨는 쪽이 제품이므로 제품을 따른다. */
  --btn-xl: 56px;   --r-xl: 14px;
  --btn-l: 48px;    --r-l: 14px;
  --btn-s: 32px;    --r-s: 8px;

  /* 완전히 둥근 사각형. 2026-09-15까지 홈의 두 버튼만 999px을 하드코딩해
     쓰고 "이 둘만의 예외"라고 적어 두었는데, 그 예외가 전부가 됐다 —
     버튼은 모두 이 값이다. 높이가 32~56으로 제각각이라 라운드를 사다리
     값으로 고정하면 낮은 버튼만 알약이 되고 높은 버튼은 모서리만 깎인
     사각형으로 남는다. 999px은 높이가 무엇이든 반원을 보장한다. */
  --r-full: 999px;

  /* 작은 표면은 4·6px 군집. 문서 크롬에서 관측된 값이다. */
  --r-surface: 6px;
  --r-surface-s: 4px;

  /* ─── 글꼴 ─────────────────────────────────────────────── */
  --ui-font: 'Lineal VF', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
  --label-font: var(--ui-font);

  /* ─── 벽 전용 ──────────────────────────────────────────────
     여기 아래 아홉 개만 옛 토큰 체계에서 살아남았다. 전부 global.css의
     /wall 렌더가 쓴다 — 강조 등장 애니메이션, 층위, 벽 캡션.

     이름이 위쪽 체계와 어긋난다(--sp-3 vs --s4, --fs-xs vs --fs-cap-s).
     지금 고치지 않은 이유는 이번 통합을 '이름은 한 글자도 안 바꾼다'로
     묶어서 계산값 대조만으로 무위험을 증명하려 했기 때문이다.
     벽 CSS를 손볼 일이 생기면 그때 위 체계로 흡수한다. */
  --sp-3: 12px;
  --sp-4: 16px;
  --fs-xs: 10px;
  --ls-mono-loose: 0.18em;
  --t-slow: 400ms;
  /* 손을 놓은 것이 제자리로 돌아오는 시간(2026-09-22, 홈 캐릭터 들어 올리기).
     순간이동은 아니되 튕기지도 않는 길이 — 벽 전용 블록에 있지만 홈이 쓴다. */
  --t-return: 220ms;
  /* 놓인 뒤 표정이 머무는 시간. 화남·슬픔·웃음을 잠깐 보였다가 기본으로
     돌아온다 — 읽힐 만큼은 길고, 표정이 상태가 될 만큼은 짧게. */
  --t-hold: 700ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-emphasized: cubic-bezier(0.05, 0.7, 0.1, 1);
  --z-content: 1;
  --z-elevated: 2;
}
