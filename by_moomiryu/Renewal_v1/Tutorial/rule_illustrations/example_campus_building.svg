<title id="title">과기대 건물 정면</title>
<desc id="description">보라색 한 가지 색으로 표현한 건물 정면. 위로 돌출된 상층부와 오른쪽의 큰 빈 공간, 규칙적인 창문을 단순한 실루엣으로 표현했습니다. 창문과 출입구는 투명합니다.</desc>
