  <title id="title">이제 당신의 말을 담아주세요</title>
  <desc id="description">작은 청록색 캐릭터가 빈 빨간 말풍선을 두 손으로 받쳐 내밉니다. 말풍선 안에는 흰 입력 커서 하나가 있고, 캐릭터의 눈은 위를 향합니다.</desc>
