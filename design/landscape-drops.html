<!-- 유머있는 = 비(2026-10-04, 디자이너). 글자 하나하나를 원에 담고(위치는 B — 잉크 상자와 무게중심 사이 + 원의 광학 중심),
     원은 채우지 않고 선으로(선 굵기 = 글자 획), 받침 글자는 원 안 위아래 틈을 같게. 벽 글자 28px.
     빠르기 막대(보통 ~ 빠르게 다섯 칸)는 글자 기울기(0 → 18°) + 내리는 빠르기 — A는 줄기 75° 그대로, B는 줄기도 눕는다.
     당당한 '사선'처럼 글자는 똑바로 세운 채 비스듬한 계단으로 잇는다. 내리는 줄기는 맨 앞 글자가 가장 아래여야 땅에 첫 글자부터
     잠기므로 계단은 오른쪽 위로 오른다(/) — 줄기는 왼쪽 아래로 비스듬히 내린다. 구름 밑에서 나와 땅(화면 밑)에 닿으면 차례로 땅 밑으로,
     몇 초 쉬고 다른 구름에서 다시. 자형 셋(둥글 · 네모 · 뾰족)은 무게 720 칸의 보정 굵기(720 · 550 · 800).
     구름은 앱 부품(CloudBubble · VoiceBubble). 개발 서버로 연다: npm run dev 뒤 http://localhost:5173/design/landscape-drops.html
     글자 자료는 견본 글의 글자만 글꼴에서 미리 뽑아 넣었다 -->
