돌풍 한 번 --t-hold × 13(9.1초)이 <b>왼쪽에서 오른쪽으로</b> 벽을 지나가고, 잔 떨림 --t-hold × 2가 바람결로 지나간다. 밑동은 가만히,

      const flutter = 0.65 + 0.35 * Math.sin(2 * Math.PI * (t / (HOLD * 2) - cx / 260) + jit[i]); // 잔 떨림 — 바람결
      const lean = AMP[ci] * p.h * gust * flutter;
      if (!lean) { ctx.drawImage(img, p.x, p.y); return; }
      for (let y = 0; y < p.h; y += 2) {                    // 2px 띠마다 옆으로 — 끝(위)일수록 (높이 비율)²
        const r = 1 - y / p.h, dx = lean * r * r;
        ctx.drawImage(img, 0, y, p.w, Math.min(2, p.h - y), p.x + dx, p.y + y, p.w, Math.min(2, p.h - y));
      }
    });
  });
  requestAnimationFrame(frame);
}
base.onload = () => requestAnimationFrame(frame);
</script></body></html>
