<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큰 돌 등장 견본</title>
<style>
  :root { --bg: #000; --ink: #e8e8e8; --dim: #8a8a8a; --line: #444; --on: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", sans-serif; }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #000; z-index: 2; flex-wrap: wrap; }
  #bar button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; cursor: pointer; }
  #bar button:disabled { opacity: .35; cursor: default; }
  #bar button.on { border-color: var(--on); color: var(--on); }
  #bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  #note { color: var(--dim); font-size: 13px; margin-left: auto; }
  canvas { display: block; position: fixed; top: 52px; left: 0; }
</style>
</head>
<body>
<div id="bar">
  <span>기대는 한도</span>
  <button data-l="15">±15°</button><button data-l="25" class="on">±25°</button><button data-l="35">±35°</button>
  <span class="sep"></span>
  <button data-k="slide">큰 돌 등장 (밀려오기)</button>
  <span class="sep"></span>
  <button id="skip" disabled>30초 건너뛰기</button>
  <button id="again">처음부터</button>
  <span id="note"></span>
</div>

}
addEventListener('resize', fit);
function text(s, scale, tb, font) {
  ctx.translate(tb.x + tb.w / 2, tb.y + tb.h / 2); ctx.rotate(s.rot ?? 0); ctx.translate(-tb.w / 2, -tb.h / 2);
  const fs = s.k * s.optic * scale, lh = tb.h / s.lines.length;
  ctx.fillStyle = s.fg; ctx.font = `${fs}px ${font}`; ctx.textBaseline = 'middle';
  const left = s.align && s.align.startsWith('hang');
  ctx.textAlign = left ? 'left' : 'center';
  s.lines.forEach((l, i) => ctx.fillText(l, left ? 0 : tb.w / 2, lh * (i + 0.5)));
}
function drawStone(it, alpha = 1) {
  const { body, c, pts, s, scale } = it;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(body.position.x, body.position.y); ctx.rotate(body.angle); ctx.translate(-c.x, -c.y);
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  ctx.fillStyle = s.bg; ctx.fill();
  text(s, scale, { x: s.tb.x * scale, y: s.tb.y * scale, w: s.tb.w * scale, h: s.tb.h * scale }, '"Batang", "Noto Serif KR", serif');
  ctx.restore();
}
function drawCloud(c, sec, alpha = 1) {
  const s = c.s, xs = s.pts.map((p) => p[0]), ys = s.pts.map((p) => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(c.x, c.y + 6 * Math.sin(sec * 0.6 + c.t)); ctx.translate(-cx, -cy);
  ctx.beginPath(); s.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  ctx.fillStyle = s.bg; ctx.fill();
  text(s, 1, s.tb, '"Malgun Gothic", sans-serif');
  ctx.restore();
}
function frame(now) {
  const dt = 1 / 60, since = (now - phaseAt) / 1000;
  if (phase === 'enter') {
    const t = Math.min(1, since / T_IN[kind]);
    place(pose(t)); shove(t);
    // 구름은 바람에 밀리듯 천천히 빨라지며 밖으로
    for (const c of clouds) { c.vx += c.dir * 260 * dt; }
    note.textContent = `등장 — ${['', '내려앉기', '밀려오기', '굴러오기'][['', 'descend', 'slide', 'tumble'].indexOf(kind)]}`;
    if (t >= 1) { setPhase('hold'); }
  } else if (phase === 'hold') {
    shove(1);
    for (const c of clouds) c.vx += c.dir * 260 * dt;
    note.textContent = `주인공 — ${Math.max(0, Math.ceil(HOLD / 1000 - since))}초`;
    if (since * 1000 >= HOLD) setPhase('exit');
  } else if (phase === 'exit') {
    // 퇴장 — 들어올 때처럼 밀려 나간다(구르지 않는다, 디자이너). 먼저 뒤로(왼쪽) 조금 물러났다가(BACK, 1초) 앞으로 천천히
    // 출발해 스르륵 빨라지며 오른쪽 밖으로 — 무거운 것이 움직이기 전의 숨
    const w = hero.s.w * GIANT, T = since, x0 = W / 2;
    let x;
    if (T < BACK_T) x = x0 - BACK * ease.inOut(T / BACK_T);
    else { const u = Math.min(1, (T - BACK_T) / GLIDE_T); x = x0 - BACK + (W / 2 + w / 2 + BACK + 60) * u ** 2.2; }
    place({ x, a: 0 });
    const t = (T - BACK_T) / GLIDE_T;
    if (t >= 1) {
      Composite.remove(engine.world, hero.body); hero = null;
      // 쓸려 나간 돌을 그 몸 그대로 제자리에 되돌린다 — 새로 지으면 맞닿은 곳이 겹쳐 튕겨 나갔다
      for (const it of items) Composite.remove(engine.world, it.body);
      items = snap.map(({ it, x, y, a }) => {
        const b = it.body; it.dir = 0; b.friction = P.friction; b.frictionStatic = P.frictionStatic;
        Body.setAngle(b, a); Body.setPosition(b, { x, y }); Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0);
        Composite.add(engine.world, b); Sleeping.set(b, true);
        return it;
      });
      clouds.forEach((c, i) => { c.x = HOMES[i][0]; c.y = HOMES[i][1]; c.vx = c.vy = 0; });
      setWalls(true);
      fade = 0;
      small = makeStone(EXTRA.hero, spot(EXTRA.hero), H - EXTRA.hero.h / 2 - 70, 1);
      setPhase('return');
    }
  } else if (phase === 'return') {
    fade = Math.min(1, since / 1.6);
    note.textContent = '풍경 복귀';
    if (since > 1.2 && small && !small.added) { small.added = true; Composite.add(engine.world, small.body); items.push(small); }
    if (since > 3.2) setPhase('rest');
  }
  for (const c of clouds) { c.x += c.vx * dt; c.y += c.vy * dt; }
  for (const it of items) if (!it.dir) right(it, dt);
  Engine.update(engine, 1000 / 60);
  if (phase === 'enter' || phase === 'hold') items = items.filter((it) => { const p = it.body.position, out = p.y > H + 900 || p.x < -1400 || p.x > W + 1400; if (out) Composite.remove(engine.world, it.body); return !out; });
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const a = phase === 'return' ? fade : 1;
  for (const c of clouds) drawCloud(c, now / 1000, a);
  for (const it of items) drawStone(it, it === small ? 1 : a);
  if (hero) drawStone(hero);
  requestAnimationFrame(frame);
}
function spot(s) {
  const spans = snap.map(({ box }) => [box.x, box.X]).sort((p, q) => p[0] - q[0]);
  let best = null, at = 0;
  for (const [a, b] of spans.concat([[W, W]])) { if (a - at >= s.w + 20 && (!best || a - at > best[1] - best[0])) best = [at, a]; at = Math.max(at, b); }
  return best ? (best[0] + best[1]) / 2 : W * (0.2 + 0.6 * rnd());
}
fit(); reset(); requestAnimationFrame(frame);
</script>
