<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 다크모드 금지(2026-09-26, 사용자 결정). 삼성 인터넷·크롬의 강제 다크가
         참여자가 고른 색까지 뒤집어, 4/5·5/5가 벽과 다른 색을 보였다 -->
    <meta name="color-scheme" content="only light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MEGAFONT" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>MEGAFONT</title>
    <!-- Adobe Fonts (Typekit) kit qgd6cda — 당당한(dunkel-sans-variable)과
         차분한(source-han-serif-kr-variable) 둘을 준다. 나머지 둘은
         public/fonts에서 우리가 들고 있다. 웹 프로젝트에는 허용 도메인
         목록이 있으니 새 도메인에 올리기 전에 Adobe Fonts에서 확인한다. -->
    <script>
      (function (d) {
        var config = { kitId: 'qgd6cda', scriptTimeout: 3000, async: true },
          h = d.documentElement,
          t = setTimeout(function () {
            h.className = h.className.replace(/\bwf-loading\b/g, '') + ' wf-inactive';
          }, config.scriptTimeout),
          tk = d.createElement('script'),
          f = false,
          s = d.getElementsByTagName('script')[0],
          a;
        h.className += ' wf-loading';
        tk.src = 'https://use.typekit.net/' + config.kitId + '.js';
        tk.async = true;
        tk.onload = tk.onreadystatechange = function () {
          a = this.readyState;
          if (f || (a && a != 'complete' && a != 'loaded')) return;
          f = true;
          clearTimeout(t);
          try {
            Typekit.load(config);
          } catch (e) {}
        };
        s.parentNode.insertBefore(tk, s);
      })(document);
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-serif-kr@5.1.0/index.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
